<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" /><link rel="stylesheet" href="/css/styles.css" />
<title>Minutly | Groceries with smart substitutes</title>

<body>
<header id="nav"></header>
<main class="container">
  <section class="hero">
    <span class="pill">SMART SUBSTITUTES</span>

  <div class="grid" id="grid"><div class="muted">Loading groceries...</div></div>
</main>

</html>
