<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E" /><link rel="stylesheet" href="/css/styles.css" />
<title>Create your account | Minutly</title>
</head>
<body>
<header id="nav"></header>
<main class="container">
  <div class="auth-wrap card">
    <h1>Create your account</h1>
    <p class="muted" style="margin:0 0 18px">It takes less than a minute.</p>
    <div class="error" id="form-error" hidden></div>
    <form id="auth-form" data-mode="signup" novalidate>
      <div class="field"><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="60" required /></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required /></div>
      <div class="field"><label for="phone">Mobile number <span class="muted">(optional)</span></label><input id="phone" inputmode="numeric" autocomplete="tel" maxlength="10" /></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required /></div>
      <button class="btn primary block" id="submit-btn" type="submit">Sign up</button>
    </form>
    <p class="muted" style="text-align:center;margin:16px 0 0">Already have an account? <a id="switch-link" href="/login.html">Log in</a></p>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
